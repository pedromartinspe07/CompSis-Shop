
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Loja Virtual</title>

        <!-- Biblioteca de ícones -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <header>
            <nav aria-label="Navegação principal">
                <form action="home.html" method="get" role="search">
                    <label for="pesquisa">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </label>
                    <input type="search" id="pesquisa" name="q">
                    <button type="submit">Buscar</button>
                </form>
                <a href="home.html">Home</a>
                <a href="home.html#contato">Contato</a>
                <a href="carrinho.html">Meu carrinho</a>
                <a href="login.html" aria-label="Minha conta">
                    <i class="fa-solid fa-user"></i>
                </a>
            </nav>
        </header>

        <main>
            <h1>Login</h1>

            <form action="#" method="post">

                <p>
                    <label for="email">
                        <i class="fa-solid fa-envelope"></i>
                    </label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required >
                </p>

                <p>
                    <label for="senha">
                        <i class="fa-solid fa-lock"></i>
                    </label>
                    <input  type="password" id="senha"  name="senha" placeholder="Digite sua senha" required>
                </p>

                <p>
                    <a href="#" id="link-esqueci-senha">
                        Esqueci minha senha
                    </a>

                    |

                    <a href="cadastro.html">
                        Cadastre-se
                    </a>
                </p>

                <button type="submit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Entrar
                </button>

            </form>
        </main>

        <script src="script.js"></script>
    </body>
    </html>
