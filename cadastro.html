
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Loja Virtual</title>

    <!-- Biblioteca de ícones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

        <header>
            <nav aria-label="Navegação principal">
                <form action="home.html" method="get" role="search">
                    <label for="pesquisa">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </label>
                    <input type="search" id="pesquisa" name="q">
                    <button type="submit">Buscar</button>
                </form>
                <a href="home.html">Home</a>
                <a href="home.html#contato">Contato</a>
                <a href="carrinho.html">Meu carrinho</a>
                <a href="login.html" aria-label="Minha conta">
                    <i class="fa-solid fa-user"></i>
                </a>
            </nav>
        </header>

        <main>
            <h1>Cadastro</h1>

            <form action="#" method="post">

                <p>
                    <label for="nome">
                        <i class="fa-solid fa-user"></i>
                    </label>
                    <input
                        type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
                </p>

                <p>
                    <label for="email">
                        <i class="fa-solid fa-envelope"></i>
                    </label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                </p>

                <p>
                    <label for="endereco">
                        <i class="fa-solid fa-house"></i>
                    </label>
                    <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço"  autocomplete="street-address" required>
                </p>

                <p>
                    <label for="telefone">
                        <i class="fa-solid fa-phone"></i>
                    </label>
                    <input type="tel"  id="telefone"  name="telefone"  placeholder="Digite seu telefone"  autocomplete="tel" required>
                </p>

                <p>
                    <label for="senha">
                        <i class="fa-solid fa-lock"></i>
                    </label>
                    <input type="password"  id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password" required>
                </p>

                <p>
                    <label for="confirmar-senha">
                        <i class="fa-solid fa-lock"></i>
                    </label>
                    <input type="password" id="confirmar-senha" name="confirmar_senha"  
                    placeholder="Confirme sua senha"  autocomplete="new-password" required>
                </p>

                <button type="submit">
                    <i class="fa-solid fa-user-check"></i>
                    Concluir cadastro
                </button>

                <p>
                    Já possui uma conta?
                    <a href="login.html">Fazer login</a>
                </p>

            </form>
        </main>

        <script src="script.js"></script>
    </body>
    </html>
